name: 'Julia Lint'
description: 'Lint a Julia repository with julialint (JuliaLintApp)'
inputs:
  code-scanning-upload:
    description: 'Also upload the SARIF to GitHub code scanning (requires the security-events: write permission)'
    required: false
    default: 'false'
outputs:
  sarif-path:
    description: 'Path of the produced SARIF file, relative to the workspace'
    value: lint-results.sarif
runs:
  using: "composite"
  steps:
    - uses: julia-actions/install-juliaup@v2
      with:
        channel: release
    - uses: julia-actions/cache@v2
    - name: Install the JuliaLintApp app
      shell: bash
      run: |
        # TODO pin a rev/tag once JuliaLintApp tags releases
        julia --color=yes -e 'using Pkg; Pkg.Apps.add(url="https://github.com/julia-vscode/JuliaLintApp.jl")'
        echo "$HOME/.julia/bin" >> "$GITHUB_PATH"
    - name: Lint
      id: lint
      shell: bash
      # Capture the exit code instead of failing here so the annotation and
      # upload steps below still run; the last step re-raises it.
      run: |
        set +e
        julialint --format sarif -o lint-results.sarif .
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
    - name: Emit annotations
      if: ${{ steps.lint.outputs.exit-code != '2' }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/index.js" lint-results.sarif
    - uses: github/codeql-action/upload-sarif@v3
      if: ${{ inputs.code-scanning-upload == 'true' && steps.lint.outputs.exit-code != '2' }}
      with:
        sarif_file: lint-results.sarif
    - name: Propagate lint exit code
      shell: bash
      run: exit ${{ steps.lint.outputs.exit-code }}
