name: 'Julia Lint'
description: 'Lint a Julia repository with julialint (LintApp)'
branding:
  icon: 'check-circle'
  color: 'purple'
inputs:
  path:
    description: 'Path to lint, relative to the workspace'
    required: false
    default: '.'
  sarif-path:
    description: 'Path to write the SARIF results file to, relative to the workspace'
    required: false
    default: 'lint-results.sarif'
  max-warnings:
    description: 'Fail when the warning count exceeds this number (default: unlimited)'
    required: false
    default: ''
  quiet:
    description: 'Report only errors (suppress warnings, info, and hints)'
    required: false
    default: 'false'
  fail-on-errors:
    description: >-
      Fail the step when lint errors are found. When false, lint findings never fail
      the step (a julialint tool failure still does).
    required: false
    default: 'true'
  code-scanning-upload:
    description: 'Also upload the SARIF to GitHub code scanning (requires the security-events: write permission)'
    required: false
    default: 'false'
outputs:
  sarif-path:
    description: 'Path of the produced SARIF file, relative to the workspace'
    value: ${{ inputs.sarif-path }}
  error-count:
    description: 'Number of error-severity lint results'
    value: ${{ steps.annotate.outputs.error-count }}
  warning-count:
    description: 'Number of warning-severity lint results'
    value: ${{ steps.annotate.outputs.warning-count }}
runs:
  using: "composite"
  steps:
    - uses: julia-actions/install-juliaup@v3
      with:
        channel: release
    - uses: julia-actions/cache@v3
    # `julialint` analyses the environments of the repository being linted in child
    # processes, and those deliberately drop JULIA_DEPOT_PATH so that the repository
    # resolves against the machine's real depot rather than whatever private one the
    # tool itself was started with. On a runner that is `~/.julia`, and nothing else in
    # this job ever runs Pkg against it -- the toolkit below gets its own depot, and the
    # registries Pkg clones while installing the toolkit land there. So the depot the
    # children actually use holds no registry, and the first thing that needs one fails:
    # `Pkg.resolve` is the one Pkg entry point in that path which does not clone the
    # default registries itself (`instantiate` and `develop` both do), so a repository
    # with no committed Manifest.toml reports "no registries have been installed" and
    # gets degraded missing-reference checks.
    #
    # Doing it here rather than leaving it to the children also keeps a registry clone
    # out of a timed indexing request, and lets the `julia-actions/cache` entry above
    # carry the result to the next run. That ordering is required, not incidental: the
    # cache action only adds `registries` to its cached paths when that directory does
    # not yet exist when it runs.
    #
    # A restored registry can be arbitrarily old -- the cache entry is only as fresh as
    # the last run that saved one -- and resolving a repository against a stale registry
    # gives answers that do not match what its CI would install. So refresh rather than
    # merely reuse. `julia-actions/cache` happens to run `Pkg.Registry.update()` itself
    # after restoring a non-empty registries directory, but that is an undocumented
    # implementation detail of that action rather than a contract, and this action's
    # results should not silently go stale if it changes. The duplicated update costs a
    # second or two when it has in fact already happened.
    #
    # Best-effort throughout: a registry that could not be installed or refreshed
    # degrades the analysis (`julialint` reports it per-scope) but should not turn a
    # transient outage into a failed lint job.
    - name: Install or refresh the registries in the job depot
      shell: bash
      # No JULIA_DEPOT_PATH here, deliberately: this has to land in the default depot.
      run: |
        julia --color=yes -e '
          import Pkg
          try
              if isempty(Pkg.Registry.reachable_registries())
                  Pkg.Registry.add()
              else
                  Pkg.Registry.update()
              end
          catch err
              showerror(stderr, err)
              println(stderr)
              println("::warning::Could not install or refresh the Julia registries in $(DEPOT_PATH[1]); environments may not resolve.")
          end
        '
    # The toolkit -- LintApp and the tree this repository's manifest pins -- is the same on
    # every run, so it does not belong in the job's depot where it is re-saved per run and
    # duplicated per ref. It gets a depot of its own here, under a key nothing run-specific
    # enters, so it is written once and then only read.
    - name: Resolve the toolkit cache key
      id: toolkit
      shell: pwsh
      run: |
        $version = (julia --version) -replace '^julia version ', ''
        # `hashFiles()` is no use here: it only resolves paths under GITHUB_WORKSPACE, and
        # the manifest that pins the toolkit lives in the action's own directory.
        $manifest = Join-Path $env:GITHUB_ACTION_PATH 'Manifest.toml'
        $hash = (Get-FileHash -Algorithm SHA256 $manifest).Hash.Substring(0, 16)
        # Julia compiles package images for whichever machine precompiles them: `cpu_target`
        # defaults to "native", and it is the literal string "native" -- not the
        # microarchitecture it resolves to -- that goes into the cache slug. A depot built on
        # one runner and restored onto another with a different CPU therefore has files at
        # exactly the paths Julia looks in, holding code it then refuses, and the toolkit
        # recompiles despite the cache hit. GitHub's fleet is mixed enough for that to happen
        # regularly; see julia-actions/cache#114. These are the multi-versioned targets the
        # Julia devdocs give for a portable system image.
        $cpuTarget = switch -Regex ($env:RUNNER_ARCH) {
            '^(X64|x64|x86_64)$' { 'generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)' }
            '^(X86|x86|i686)$'   { 'pentium4' }
            '^(ARM64|aarch64)$'  { 'generic' }
            default              { '' }
        }
        # A target the platform does not support makes Julia refuse to start, so it is probed
        # rather than assumed. `--cpu-target` rejects a multi-versioned string outright unless
        # a sysimage is being written, so each variant's CPU name is checked on its own; the
        # feature flags and `clone_all`/`base(1)` around them are multi-versioning syntax
        # rather than anything platform-dependent.
        $supported = [bool] $cpuTarget
        foreach ($variant in ($cpuTarget -split ';')) {
            if (-not $supported) { break }
            julia "--cpu-target=$(($variant -split ',')[0])" -e 'exit(0)' 2>&1 | Out-Null
            if ($LASTEXITCODE -ne 0) { $supported = $false }
        }
        if (-not $supported) {
            if ($cpuTarget) {
                Write-Host "::warning::Julia here does not support --cpu-target=$cpuTarget; leaving its default, so this toolkit cache is not portable between runner CPUs."
            }
            # The string Julia uses when the variable is unset, so this is exactly the
            # behaviour the action had before.
            $cpuTarget = 'native'
        }
        # Forward slashes throughout: `actions/cache` matches the paths below as globs, and a
        # Windows backslash is an escape character to the glob parser. Julia takes either.
        $depot = (Join-Path $env:RUNNER_TEMP 'julia-lint-toolkit-depot') -replace '\\', '/'
        "version=$version" >> $env:GITHUB_OUTPUT
        "hash=$hash" >> $env:GITHUB_OUTPUT
        "depot=$depot" >> $env:GITHUB_OUTPUT
        "cpu-target=$cpuTarget" >> $env:GITHUB_OUTPUT
    - name: Restore the toolkit depot
      uses: actions/cache@v5
      with:
        # Deliberately no `restore-keys`: a prefix match would load a depot precompiled by a
        # different Julia, which is the one case this key exists to rule out. `v=1` is a
        # hand-turned version for the contents of the entry, and it matters because an exact
        # hit suppresses the save -- an entry that has become unusable would otherwise be
        # restored, rejected, rebuilt and then not replaced, on every run, forever. Bump it
        # for any change that makes existing entries unusable rather than merely stale: a
        # different `$cpuTarget`, which is part of the cache slug Julia computes, or a
        # different set of cached paths below.
        key: julia-lint-toolkit;v=1;os=${{ runner.os }};arch=${{ runner.arch }};julia=${{ steps.toolkit.outputs.version }};manifest=${{ steps.toolkit.outputs.hash }}
        # `scratchspaces` and `logs` are left out on purpose: this entry is written once and
        # read forever after, so anything workspace-shaped in it would be frozen for every
        # later user of the key.
        path: |
          ${{ steps.toolkit.outputs.depot }}/packages
          ${{ steps.toolkit.outputs.depot }}/compiled
          ${{ steps.toolkit.outputs.depot }}/artifacts
          ${{ steps.toolkit.outputs.depot }}/registries
    - name: Install and precompile
      shell: bash
      # The committed Manifest.toml pins the exact versions of LintApp
      # and all of its dependencies; instantiate installs precisely those.
      run: julia --color=yes -e 'import Pkg; Pkg.instantiate()'
      env:
        JULIA_PROJECT: ${{ github.action_path }}
        JULIA_DEPOT_PATH: ${{ steps.toolkit.outputs.depot }}
        JULIA_CPU_TARGET: ${{ steps.toolkit.outputs.cpu-target }}
    - name: Lint
      id: lint
      shell: bash
      # Capture the exit code instead of failing here so the annotation and
      # upload steps below still run; the last step re-raises it.
      run: |
        set +e
        args=("${LINT_PATH:-.}" --format sarif -o "${SARIF_PATH:-lint-results.sarif}")
        if [ -n "$MAX_WARNINGS" ]; then args+=(--max-warnings "$MAX_WARNINGS"); fi
        if [ "$QUIET" = "true" ]; then args+=(--quiet); fi
        julia --color=yes --project="$GITHUB_ACTION_PATH" -m LintApp "${args[@]}"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
      env:
        # The toolkit lives in a depot of its own, and its cache slug is recomputed
        # at load time -- so both have to be set here too, not only where it was built.
        JULIA_DEPOT_PATH: ${{ steps.toolkit.outputs.depot }}
        JULIA_CPU_TARGET: ${{ steps.toolkit.outputs.cpu-target }}
        LINT_PATH: ${{ inputs.path }}
        SARIF_PATH: ${{ inputs.sarif-path }}
        MAX_WARNINGS: ${{ inputs.max-warnings }}
        QUIET: ${{ inputs.quiet }}
    - name: Emit annotations
      id: annotate
      if: ${{ steps.lint.outputs.exit-code != '2' }}
      shell: bash
      run: node "$GITHUB_ACTION_PATH/dist/index.js" "$SARIF_PATH"
      env:
        SARIF_PATH: ${{ inputs.sarif-path }}
    - uses: github/codeql-action/upload-sarif@v4
      if: ${{ inputs.code-scanning-upload == 'true' && steps.lint.outputs.exit-code != '2' }}
      with:
        sarif_file: ${{ inputs.sarif-path }}
    - name: Propagate lint exit code
      shell: bash
      # A tool failure (exit code 2) always fails; lint findings (exit code 1)
      # only fail when fail-on-errors is true.
      run: |
        code=${CODE:-2}
        if [ "$FAIL_ON_ERRORS" != "true" ] && [ "$code" = "1" ]; then exit 0; fi
        exit $code
      env:
        CODE: ${{ steps.lint.outputs.exit-code }}
        FAIL_ON_ERRORS: ${{ inputs.fail-on-errors }}
